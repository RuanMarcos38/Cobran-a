name: Testes locais
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: node tests/sectors.local.mjs
      - run: node tests/finance.local.mjs
      - run: node tests/pricing.local.mjs
      - run: node tests/scheduling.local.mjs
      - run: node --check web/app.mjs && node --check server.mjs
